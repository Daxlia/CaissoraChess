[package]
name = "caissora-chess"
version = "0.1.0"
edition = "2021"

[lib]
name = "caissora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
caissora-core = { path = "../crates/core" }

# Pacchetto autonomo: non fa parte del workspace del core (che si compila senza WebView).
[workspace]
