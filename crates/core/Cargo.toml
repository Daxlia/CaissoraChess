[package]
name = "caissora-core"
version = "0.1.0"
edition = "2024"

[dependencies]
arrow-array = "60.2.0"
csv = "1.4.0"
futures-util = "0.3.34"
parquet = { version = "60.2.0", default-features = false, features = ["arrow", "snap", "zstd"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
shakmaty = "0.30.3"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "process", "io-util", "sync", "time", "macros", "net", "rt-multi-thread"] }
zstd = "0.14.4"
